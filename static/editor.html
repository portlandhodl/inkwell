<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkwell · Markdown editor</title>
  <meta name="description" content="A fast, beautiful Markdown editor that runs in your browser: live preview, math, diagrams, themes, share links and import/export. No sign-up, and your documents stay on your device.">
  <meta name="theme-color" content="#6d5dfc">
  <link rel="canonical" href="%SITE_URL%">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- Link previews. Open Graph covers Facebook, LinkedIn, Slack, Discord, WhatsApp, iMessage,
       Telegram, Teams, Signal, Mastodon, Bluesky and Reddit; twitter:* covers X. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Inkwell">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="%SITE_URL%">
  <meta property="og:title" content="Inkwell — Markdown editor powered by Rust + WebAssembly">
  <meta property="og:description" content="A fast, beautiful Markdown editor that runs in your browser: live preview, math, diagrams, themes, share links and import/export. No sign-up, and your documents stay on your device.">
  <meta property="og:image" content="%SITE_URL%og-image.png">
  <meta property="og:image:secure_url" content="%SITE_URL%og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Inkwell, the Markdown editor powered by Rust + WebAssembly, showing Markdown source next to its live preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Inkwell — Markdown editor powered by Rust + WebAssembly">
  <meta name="twitter:description" content="A fast, beautiful Markdown editor that runs in your browser: live preview, math, diagrams, themes, share links and import/export. No sign-up, and your documents stay on your device.">
  <meta name="twitter:image" content="%SITE_URL%og-image.png">
  <meta name="twitter:image:alt" content="Inkwell, the Markdown editor powered by Rust + WebAssembly, showing Markdown source next to its live preview">
  <!-- Slack shows these as extra rows under the preview -->
  <meta name="twitter:label1" content="Engine">
  <meta name="twitter:data1" content="Rust + WebAssembly">
  <meta name="twitter:label2" content="Privacy">
  <meta name="twitter:data2" content="Documents stay on your device">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/preview.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="toggle-sidebar" data-icon="sidebar" title="Toggle sidebar (Alt+B)" aria-label="Toggle sidebar"></button>
      <div class="brand"><span id="logo"></span><span class="brand-name">Inkwell</span></div>
      <div class="title-wrap">
        <input id="doc-title" spellcheck="false" autocomplete="off" aria-label="Document title" placeholder="Untitled">
        <span class="save-state" id="save-state" data-state="saved"></span>
      </div>
      <div class="spacer"></div>
      <div class="segmented" id="view-switch" role="tablist" aria-label="View mode">
        <button data-view="edit" data-icon="pen" title="Write only"><span>Write</span></button>
        <button data-view="split" data-icon="split" title="Split view"><span>Split</span></button>
        <button data-view="preview" data-icon="eye" title="Preview only"><span>Preview</span></button>
      </div>
      <button class="btn" id="import-btn" data-icon="upload" aria-haspopup="menu">Import</button>
      <button class="btn" id="share-btn" data-icon="share" title="Share (Ctrl+Shift+S)">Share</button>
      <button class="btn primary" id="export-btn" data-icon="download" aria-haspopup="menu">Export</button>
      <button class="icon-btn" id="theme-btn" data-icon="palette" title="Theme" aria-label="Theme" aria-haspopup="menu"></button>
      <button class="icon-btn" id="zen-btn" data-icon="zen" title="Zen mode (Alt+Z)" aria-label="Zen mode"></button>
      <button class="icon-btn" id="palette-btn" data-icon="command" title="Command palette (Ctrl+Shift+P)" aria-label="Command palette"></button>
      <button class="icon-btn" id="settings-btn" data-icon="settings" title="Settings" aria-label="Settings"></button>
    </header>

    <nav class="toolbar" id="toolbar" aria-label="Formatting"></nav>

    <main class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="side-tabs">
          <button data-tab="docs" data-icon="file">Documents</button>
          <button data-tab="outline" data-icon="outline">Outline</button>
        </div>
        <div class="side-panel" data-panel="docs">
          <div class="side-actions">
            <label class="search"><span data-icon="search"></span><input id="doc-search" placeholder="Search documents" aria-label="Search documents"></label>
            <button class="icon-btn" id="sort-docs" data-icon="sort" title="Sort documents" aria-label="Sort documents" aria-haspopup="menu"></button>
            <button class="icon-btn accent" id="new-doc" data-icon="plus" title="New document (Alt+N)" aria-label="New document"></button>
          </div>
          <ul class="doc-list" id="doc-list"></ul>
        </div>
        <div class="side-panel" data-panel="outline" hidden>
          <nav id="outline" class="outline" aria-label="Document outline"></nav>
          <div id="backlinks" class="backlinks" aria-label="Backlinks"></div>
        </div>
        <div class="side-foot"><div class="wasm-badge" data-icon="bolt">Rust + WebAssembly engine</div></div>
      </aside>

      <div class="panes" id="panes">
        <section class="pane editor-pane" id="editor-pane" aria-label="Editor"><div id="editor"></div></section>
        <div class="resizer" id="resizer" title="Drag to resize · double-click to reset"></div>
        <section class="pane preview-pane" id="preview-pane" aria-label="Preview"><article id="preview" class="markdown-body"></article></section>
      </div>
    </main>

    <footer class="statusbar">
      <span id="st-words"></span>
      <span id="st-chars"></span>
      <span id="st-read"></span>
      <span id="st-tasks" hidden></span>
      <span class="spacer"></span>
      <label class="pw" id="st-width" title="Preview width · double-click to reset"><span data-icon="width"></span><input type="range" id="preview-width" min="400" max="1600" step="20" aria-label="Preview width"><output id="preview-width-out"></output></label>
      <button id="st-goal" class="goal" hidden><span></span></button>
      <span id="st-cursor"></span>
      <span id="st-engine" class="engine"></span>
    </footer>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="drop-overlay" id="drop-overlay"><div><span data-icon="download"></span>Drop to import</div></div>
  <input type="file" id="file-input" hidden multiple accept=".md,.markdown,.mdown,.mkd,.mkdn,.mdx,.txt,.text,.html,.htm,.json,text/markdown,text/plain,text/html,application/json">
  <input type="file" id="image-input" hidden multiple accept="image/*">
  <script src="dist/app.js"></script>
</body>
</html>
